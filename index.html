<title>kidpsi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#fafaf9;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:14px;padding:2.5rem 2rem;max-width:480px;width:100%}
.header{text-align:center;margin-bottom:2rem}
h1{font-size:20px;font-weight:500;margin-bottom:.4rem}
.sub{font-size:14px;color:#888}
.section-label{font-size:11px;color:#bbb;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;font-weight:500}
.link-card{display:flex;align-items:center;gap:14px;background:#f7f7f5;border:1px solid #e5e5e0;border-radius:10px;padding:1rem 1.25rem;text-decoration:none;color:#1a1a1a;transition:background .15s,border-color .15s}
.link-card:hover{background:#f0f0ec;border-color:#ccc}
.icon{font-size:26px;flex-shrink:0}
.link-card h2{font-size:15px;font-weight:500;margin-bottom:2px}
.link-card p{font-size:12.5px;color:#888;line-height:1.4}
footer{margin-top:1.5rem;font-size:12px;color:#bbb;text-align:center}
</style>
<style>.ib-serp {
  display: flex;
  align-items: center;
  height: 22px;
  position: relative;
  line-height: 22px;
  border-radius: 5px;
  border-collapse: initial;
  text-decoration: none !important;
  background-size: contain;
  background-position: 5px center;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ib-serp b span {
  color: inherit !important;
  font-weight: bold !important;
}
.ib-serp__link {
  text-decoration: underline;
}
.ib-serp__link /deep/ span {
  color: inherit !important;
  font-weight: bold !important;
}
.ib-serp__logo {
  display: inline-block;
  width: 22px;
  height: 22px;
  background-size: contain;
  background-position: 5px center;
  background-repeat: no-repeat;
  background-position: center;
  border-radius: 2px;
}
.ib-serp__text {
  display: inline-block;
  font-family: 'Roboto', Helvetica, sans-serif;
  font-size: 16px;
  font-weight: bold;
  margin-left: 10px;
}
</style><style>@font-face {

}

}
</style></head>

<div class="card">

</div>
<footer>kidpsi.github.io</footer>
